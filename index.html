<title>ちゃむ検定</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">

<style>
  :root{
    --ground:#FDF5E8;
    --ground-2:#F6EEDF;
    --card:#FFFFFF;
    --aqua:#79C8E3;
    --aqua-soft:#D9F0F8;
    --aqua-deep:#2F7F9E;
    --berry:#F2A0B4;
    --berry-soft:#FCE3E9;
    --berry-deep:#C0526C;
    --ink:#6A5A4C;
    --ink-soft:#A99781;
    --line:#EADFCC;
    --shadow:0 10px 0 rgba(106,90,76,.07), 0 18px 34px rgba(106,90,76,.10);
    --radius:26px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100%;
    background-color:var(--ground);
    background-image:
      radial-gradient(circle at 12% 14%, rgba(121,200,227,.20) 0 9px, transparent 10px),
      radial-gradient(circle at 84% 9%,  rgba(242,160,180,.18) 0 7px, transparent 8px),
      radial-gradient(circle at 90% 46%, rgba(121,200,227,.14) 0 12px, transparent 13px),
      radial-gradient(circle at 8%  62%, rgba(242,160,180,.14) 0 10px, transparent 11px),
      radial-gradient(circle at 70% 88%, rgba(121,200,227,.16) 0 8px, transparent 9px),
      radial-gradient(circle at 24% 94%, rgba(242,160,180,.12) 0 11px, transparent 12px),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    font-weight:500;
    line-height:1.8;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  .page{
    max-width:560px;
    margin:0 auto;
    padding:34px 18px 50px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  /* ── ヘッダー ───────────────────────── */
  .header{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:6px 8px 4px;
    width:100%;
  }
  .header__flower{width:56px; height:56px; display:block; flex:0 0 auto;}
  .header__title{
    font-family:"Yusei Magic","Zen Maru Gothic",cursive;
    font-size:1.9rem;
    color:var(--berry-deep);
    margin:0;
    line-height:1.4;
    width:100%;
    min-width:0;
  }
  .header__sub{
    font-size:.92rem;
    color:var(--ink);
    margin:0;
    font-weight:700;
    width:100%;
    min-width:0;
  }
  .header__note{
    font-size:.8rem;
    color:var(--ink-soft);
    margin:0;
    width:100%;
    min-width:0;
  }

  /* ── クイズ一覧 ─────────────────────── */
  .list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 20px;
    min-height:84px;
    min-width:0;
    text-decoration:none;
    color:inherit;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.card:active{
    transform:translateY(2px) scale(.99);
    box-shadow:0 4px 0 rgba(106,90,76,.07), 0 10px 20px rgba(106,90,76,.10);
  }
  .card--locked{
    opacity:.62;
  }

  .card__mark{
    flex:0 0 auto;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--aqua-soft);
    color:var(--aqua-deep);
    display:grid; place-items:center;
    font-family:"Yusei Magic","Zen Maru Gothic",cursive;
    font-size:1.15rem;
  }
  .card--locked .card__mark{
    background:var(--ground-2);
    color:var(--ink-soft);
  }

  .card__body{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .card__title{
    font-family:"Yusei Magic","Zen Maru Gothic",cursive;
    font-size:1.08rem;
    color:var(--aqua-deep);
    line-height:1.4;
  }
  .card--locked .card__title{color:var(--ink-soft);}
  .card__lead{
    font-size:.82rem;
    color:var(--ink);
    line-height:1.7;
  }
  .card__meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:2px;
  }
  .card__count{
    font-size:.74rem;
    color:var(--ink-soft);
    font-weight:700;
  }
  .card__badge{
    font-size:.7rem;
    font-weight:900;
    letter-spacing:.05em;
    padding:2px 10px;
    border-radius:999px;
    background:var(--berry-soft);
    color:var(--berry-deep);
  }

  .card__arrow{
    flex:0 0 auto;
    font-size:1.3rem;
    color:var(--aqua-deep);
  }
  .card--locked .card__arrow{color:var(--ink-soft);}

  /* ── フッター ───────────────────────── */
  .footer{
    text-align:center;
    padding:10px 10px 0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .footer p{
    margin:0;
    font-size:.74rem;
    color:var(--ink-soft);
    line-height:1.8;
  }

  :focus-visible{outline:3px solid var(--berry); outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>

<div class="page">

  <header class="header">
    <svg class="header__flower" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#F2A0B4">
        <ellipse cx="50" cy="24" rx="17" ry="20"/>
        <ellipse cx="76" cy="43" rx="17" ry="20" transform="rotate(72 76 43)"/>
        <ellipse cx="66" cy="74" rx="17" ry="20" transform="rotate(144 66 74)"/>
        <ellipse cx="34" cy="74" rx="17" ry="20" transform="rotate(216 34 74)"/>
        <ellipse cx="24" cy="43" rx="17" ry="20" transform="rotate(288 24 43)"/>
      </g>
      <circle cx="50" cy="52" r="13" fill="#FDF5E8"/>
    </svg>
    <h1 class="header__title">ちゃむ検定</h1>
    <p class="header__sub">んぽちゃむのファンが作った<br>非公式のクイズです</p>
    <p class="header__note">全部4択。スマホでそのまま遊べるちゃむ。</p>
  </header>

  <nav class="list" id="list" aria-label="クイズ一覧"></nav>

  <footer class="footer">
    <p>出典：可哀想に! 公式YouTube</p>
    <p>このページはファンが個人で作ったものです。公式とは関係ありません。</p>
  </footer>

</div>

<script>
(function(){
  "use strict";

  // ready:false の3本（はじまり編・たべもの編・日常編）は、
  // 人間チェック（企画.md 前提6）がまだ済んでいないため公開しない。
  var QUIZZES = [
    { file:"ちゃむ検定.html",             title:"ちゃむ検定",       lead:"んぽちゃむのことをどれだけ知ってるか", count:"20問", ready:true },
    { file:"ちゃむ検定_じょうきゅう編.html", title:"じょうきゅう編",   lead:"服の文字、時計の針、セリフの順番",       count:"10問", ready:true },
    { file:"ちゃむ検定_じょうきゅう編2.html", title:"じょうきゅう編2",  lead:"看板の矢印、教科書のページ、通帳の名前", count:"10問", ready:true },
    { file:"ちゃむ検定_どうが編.html",       title:"どうが編",         lead:"動画3本を、ちゃんと見てたか",           count:"10問", ready:true },
    { file:"ちゃむ検定_スパ沢さん編.html",   title:"スパ沢さん編",     lead:"『スパ沢さん』1本だけで10問",           count:"10問", ready:true },
    { file:"ちゃむ検定_はじまり編.html",     title:"はじまり編",       lead:"いちばん最初の5本から",                 count:"10問", ready:false },
    { file:"ちゃむ検定_たべもの編.html",     title:"たべもの編",       lead:"焼き芋、祭り、ポップコーン、ケーキ",     count:"10問", ready:false },
    { file:"ちゃむ検定_日常編.html",         title:"日常編",           lead:"引き戸、静電気、クロップド丈",           count:"10問", ready:false }
  ];

  var list = document.getElementById("list");

  QUIZZES.forEach(function(item){
    var el = document.createElement(item.ready ? "a" : "div");
    el.className = "card" + (item.ready ? "" : " card--locked");
    if(item.ready){
      el.href = item.file;
    }else{
      el.setAttribute("aria-disabled", "true");
    }

    var mark = document.createElement("span");
    mark.className = "card__mark";
    mark.setAttribute("aria-hidden", "true");
    mark.textContent = "Q";
    el.appendChild(mark);

    var body = document.createElement("span");
    body.className = "card__body";

    var title = document.createElement("span");
    title.className = "card__title";
    title.textContent = item.title;
    body.appendChild(title);

    var lead = document.createElement("span");
    lead.className = "card__lead";
    lead.textContent = item.lead;
    body.appendChild(lead);

    var meta = document.createElement("span");
    meta.className = "card__meta";
    var count = document.createElement("span");
    count.className = "card__count";
    count.textContent = item.count;
    meta.appendChild(count);
    if(!item.ready){
      var badge = document.createElement("span");
      badge.className = "card__badge";
      badge.textContent = "準備中";
      meta.appendChild(badge);
    }
    body.appendChild(meta);

    el.appendChild(body);

    var arrow = document.createElement("span");
    arrow.className = "card__arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = item.ready ? "›" : "";
    el.appendChild(arrow);

    list.appendChild(el);
  });
})();
</script>
